apiVersion: v1
kind: ConfigMap
metadata:
  name: kyc-config
  namespace: lendkit
data:
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  SERVICE_PORT: "8001"
  DB_POOL_SIZE: "10"
  DB_MAX_OVERFLOW: "20"
  BIN_CACHE_TTL: "86400"
  IDENTITY_PROVIDER: "smile_id"
  DOCUMENT_PROVIDER: "aws_textract"
  EVENT_BACKEND: "redis"
  OTEL_ENABLED: "true"
  OTEL_SERVICE_NAME: "kyc-service"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger-collector.monitoring:4317"
  CELERY_TASK_SERIALIZER: "json"
  CELERY_RESULT_EXPIRES: "3600"
