[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "lendkit-kyc"
version = "0.1.0"
description = "LendKit KYC/BIN Verification Service"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # Caching & task queue
    "redis[hiredis]>=5.0.4",
    "celery[redis]>=5.4.0",

    # HTTP client
    "httpx>=0.27.0",
    "tenacity>=8.3.0",

    # Validation & settings
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",

    # Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=42.0.0",

    # Observability
    "structlog>=24.2.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "prometheus-client>=0.20.0",

]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "faker>=25.0.0",
    "ruff>=0.4.7",
    "mypy>=1.10.0",
    "types-redis>=4.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S", "B", "A"]
ignore = [
    "S101",  # assert used in tests
    "S105",  # hardcoded password (false positives on var names)
    "B008",  # FastAPI Query/Depends in function defaults — intentional pattern
    "E501",  # line too long — handled by formatter, not linter
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "app/db/seed.py"]
