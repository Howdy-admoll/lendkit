[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lendkit-loan-origination"
version = "0.1.0-alpha"
description = "LendKit loan-origination service (scaffold)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.7",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.hatch.build.targets.wheel]
packages = ["app"]
