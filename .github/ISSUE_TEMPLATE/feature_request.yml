name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please describe the problem you're trying to solve.

  - type: dropdown
    id: service
    attributes:
      label: Relevant Service
      options:
        - kyc
        - credit-scoring
        - loan-origination
        - repayment
        - shared-library
        - infra
        - new service
        - docs
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve? Who experiences it?
      placeholder: "As a lender deploying LendKit, I need X because Y..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches did you consider?

  - type: dropdown
    id: contribution
    attributes:
      label: Are you willing to contribute this?
      options:
        - "Yes — I'll open a PR"
        - "Maybe — with some guidance"
        - "No — submitting the idea only"
    validations:
      required: true
