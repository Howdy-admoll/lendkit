name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/lendkit

jobs:
  # ---------------------------------------------------------------------------
  # Lint & Type Check
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [kyc, credit-scoring, loan-origination, repayment]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linting tools
        run: pip install ruff mypy

      - name: Ruff lint — ${{ matrix.service }}
        run: ruff check services/${{ matrix.service }}/app/
        continue-on-error: false

      - name: Ruff format check — ${{ matrix.service }}
        run: ruff format --check services/${{ matrix.service }}/app/

  # ---------------------------------------------------------------------------
  # Unit Tests
  # ---------------------------------------------------------------------------
  test:
    name: Tests — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [kyc]  # expand as services add tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lendkit
          POSTGRES_PASSWORD: lendkit
          POSTGRES_DB: kyc_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies — ${{ matrix.service }}
        run: |
          cd services/${{ matrix.service }}
          pip install -e ".[dev]"

      - name: Run tests — ${{ matrix.service }}
        env:
          SECRET_KEY: ci-test-secret-key-do-not-use-in-production-32ch
          DB_URL: postgresql+asyncpg://lendkit:lendkit@localhost:5432/kyc_test
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: development
          IDENTITY_PROVIDER: mock
          DOCUMENT_PROVIDER: mock
          EVENT_BACKEND: redis
          REDIS_STREAM_URL: redis://localhost:6379/1
        run: |
          cd services/${{ matrix.service }}
          pytest tests/ -v --tb=short --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: services/${{ matrix.service }}/coverage.xml
          flags: ${{ matrix.service }}
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # Validator unit tests (no services needed)
  # ---------------------------------------------------------------------------
  test-shared:
    name: Shared Library Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run shared validator tests
        run: |
          python3 -c "
          import sys; sys.path.insert(0, '.')
          from shared.utils.validators import is_valid_luhn, is_valid_bvn, nuban_checksum, to_kobo
          assert is_valid_luhn('4111111111111111')
          assert is_valid_bvn('22187654321')
          assert to_kobo('100.50') == 10050
          print('All shared tests passed')
          "

  # ---------------------------------------------------------------------------
  # YAML / Config Validation
  # ---------------------------------------------------------------------------
  validate-configs:
    name: Validate YAML & configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pyyaml
      - name: Validate Kubernetes manifests
        run: |
          python3 -c "
          import yaml, glob, sys
          errors = []
          for f in glob.glob('infra/k8s/**/*.yaml', recursive=True):
              try:
                  list(yaml.safe_load_all(open(f)))
              except yaml.YAMLError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              for e in errors: print('ERROR:', e)
              sys.exit(1)
          print(f'All K8s YAML files are valid')
          "
      - name: Validate docker-compose
        run: |
          docker compose config --quiet
          echo "docker-compose.yml is valid"

  # ---------------------------------------------------------------------------
  # Docker Build (on PR + push to main)
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker Build — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [lint, test, test-shared]
    strategy:
      matrix:
        service: [kyc, credit-scoring, loan-origination, repayment]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image — ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          target: production
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:pr-${{ github.event.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Security Scan (Trivy — on push to main)
  # ---------------------------------------------------------------------------
  security-scan:
    name: Security Scan — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [kyc]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          target: production
          push: false
          load: true
          tags: lendkit-${{ matrix.service }}:scan

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: lendkit-${{ matrix.service }}:scan
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'  # don't fail CI, just report

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif

  # ---------------------------------------------------------------------------
  # Publish Images (push to main only)
  # ---------------------------------------------------------------------------
  publish:
    name: Publish Images
    runs-on: ubuntu-latest
    needs: [docker-build, validate-configs]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [kyc, credit-scoring, loan-origination, repayment]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push — ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
