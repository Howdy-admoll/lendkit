name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/lendkit

jobs:
  # ---------------------------------------------------------------------------
  # Lint & Type Check
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: kyc
            strict: true
          - service: credit-scoring
            strict: false
          - service: loan-origination
            strict: false
          - service: repayment
            strict: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linting tools
        run: pip install ruff

      - name: Ruff lint — ${{ matrix.service }}
        run: ruff check services/${{ matrix.service }}/app/
        continue-on-error: ${{ !matrix.strict }}

      - name: Ruff format check — ${{ matrix.service }}
        run: ruff format --check services/${{ matrix.service }}/app/
        continue-on-error: ${{ !matrix.strict }}

  # ---------------------------------------------------------------------------
  # Unit Tests — KYC (needs Postgres + Redis for migrations + integration)
  # ---------------------------------------------------------------------------
  test:
    name: Tests — kyc
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lendkit
          POSTGRES_PASSWORD: lendkit
          POSTGRES_DB: kyc_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies — kyc
        run: |
          cd services/kyc
          pip install -e ".[dev]"
          # Install shared library as editable path dep (not on PyPI)
          pip install -e "../../shared" --no-deps 2>/dev/null || true

      - name: Run migrations — kyc
        env:
          DB_URL: postgresql+asyncpg://lendkit:lendkit@localhost:5432/kyc_test
          SECRET_KEY: ci-test-secret-key-do-not-use-in-production-32ch
        run: |
          cd services/kyc
          alembic upgrade head

      - name: Run tests — kyc
        env:
          SECRET_KEY: ci-test-secret-key-do-not-use-in-production-32ch
          DB_URL: postgresql+asyncpg://lendkit:lendkit@localhost:5432/kyc_test
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: development
          IDENTITY_PROVIDER: mock
          DOCUMENT_PROVIDER: mock
          EVENT_BACKEND: redis
          REDIS_STREAM_URL: redis://localhost:6379/1
        run: |
          cd services/kyc
          pytest tests/ -v --tb=short --cov=app --cov-report=xml

      - name: Upload coverage — kyc
        uses: codecov/codecov-action@v4
        with:
          file: services/kyc/coverage.xml
          flags: kyc
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # Unit Tests — Credit Scoring (pure engine tests, no DB/Redis needed)
  # ---------------------------------------------------------------------------
  test-credit-scoring:
    name: Tests — credit-scoring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies — credit-scoring
        run: |
          cd services/credit-scoring
          pip install -e ".[dev]"

      - name: Run tests — credit-scoring
        env:
          SECRET_KEY: ci-test-secret-key-do-not-use-in-production-32ch
          DB_URL: postgresql+asyncpg://lendkit:lendkit@localhost:5432/credit_scoring_test
          REDIS_URL: redis://localhost:6379/0
          REDIS_STREAM_URL: redis://localhost:6379/1
          APP_ENV: development
        run: |
          cd services/credit-scoring
          pytest tests/ -v --tb=short --cov=app --cov-report=xml

      - name: Upload coverage — credit-scoring
        uses: codecov/codecov-action@v4
        with:
          file: services/credit-scoring/coverage.xml
          flags: credit-scoring
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # Unit Tests — Loan Origination (pure underwriting engine, no DB/HTTP needed)
  # ---------------------------------------------------------------------------
  test-loan-origination:
    name: Tests — loan-origination
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies — loan-origination
        run: |
          cd services/loan-origination
          pip install -e ".[dev]"

      - name: Run tests — loan-origination
        env:
          SECRET_KEY: ci-test-secret-key-do-not-use-in-production-32ch
          DB_URL: postgresql+asyncpg://lendkit:lendkit@localhost:5432/loan_origination_test
          APP_ENV: development
        run: |
          cd services/loan-origination
          pytest tests/ -v --tb=short --cov=app --cov-report=xml

      - name: Upload coverage — loan-origination
        uses: codecov/codecov-action@v4
        with:
          file: services/loan-origination/coverage.xml
          flags: loan-origination
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # Validator unit tests (no services needed)
  # ---------------------------------------------------------------------------
  test-shared:
    name: Shared Library Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run shared validator tests
        run: |
          python3 -c "
          import sys; sys.path.insert(0, '.')
          from shared.utils.validators import is_valid_luhn, is_valid_bvn, nuban_checksum, to_kobo
          assert is_valid_luhn('4111111111111111')
          assert is_valid_bvn('22187654321')
          assert to_kobo('100.50') == 10050
          print('All shared tests passed')
          "

  # ---------------------------------------------------------------------------
  # Unit Tests — Repayment (pure engine tests, no DB/Redis needed)
  # ---------------------------------------------------------------------------
  test-repayment:
    name: Tests — repayment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies — repayment
        run: |
          cd services/repayment
          pip install -e ".[dev]"

      - name: Run tests — repayment
        env:
          SECRET_KEY: ci-test-secret-key-do-not-use-in-production-32ch
          DB_URL: postgresql+asyncpg://lendkit:lendkit@localhost:5432/repayment_test
          APP_ENV: development
        run: |
          cd services/repayment
          pytest tests/ -v --tb=short --cov=app --cov-report=xml

      - name: Upload coverage — repayment
        uses: codecov/codecov-action@v4
        with:
          file: services/repayment/coverage.xml
          flags: repayment
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # Unit Tests — Disbursement (pure engine tests, no DB/HTTP needed)
  # ---------------------------------------------------------------------------
  test-disbursement:
    name: Tests — disbursement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies — disbursement
        run: |
          cd services/disbursement
          pip install -e ".[dev]"

      - name: Run tests — disbursement
        env:
          SECRET_KEY: ci-test-secret-key-do-not-use-in-production-32ch
          DB_URL: postgresql+asyncpg://lendkit:lendkit@localhost:5432/disbursement_test
          APP_ENV: development
        run: |
          cd services/disbursement
          pytest tests/ -v --tb=short --cov=app --cov-report=xml

      - name: Upload coverage — disbursement
        uses: codecov/codecov-action@v4
        with:
          file: services/disbursement/coverage.xml
          flags: disbursement
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # Unit Tests — Notification (pure engine tests, no DB/HTTP needed)
  # ---------------------------------------------------------------------------
  test-notification:
    name: Tests — notification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies — notification
        run: |
          cd services/notification
          pip install -e ".[dev]"

      - name: Run tests — notification
        env:
          SECRET_KEY: ci-test-secret-key-do-not-use-in-production-32ch
          DB_URL: postgresql+asyncpg://lendkit:lendkit@localhost:5432/notification_test
          APP_ENV: development
        run: |
          cd services/notification
          pytest tests/ -v --tb=short --cov=app --cov-report=xml

      - name: Upload coverage — notification
        uses: codecov/codecov-action@v4
        with:
          file: services/notification/coverage.xml
          flags: notification
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # Unit Tests — Collections (pure engine tests, no DB/HTTP needed)
  # ---------------------------------------------------------------------------
  test-collections:
    name: Tests — collections
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies — collections
        run: |
          cd services/collections
          pip install -e ".[dev]"

      - name: Run tests — collections
        env:
          SECRET_KEY: ci-test-secret-key-do-not-use-in-production-32ch
          DB_URL: postgresql+asyncpg://lendkit:lendkit@localhost:5432/collections_test
          APP_ENV: development
        run: |
          cd services/collections
          pytest tests/ -v --tb=short --cov=app --cov-report=xml

      - name: Upload coverage — collections
        uses: codecov/codecov-action@v4
        with:
          file: services/collections/coverage.xml
          flags: collections
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # YAML / Config Validation
  # ---------------------------------------------------------------------------
  validate-configs:
    name: Validate YAML & configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pyyaml
      - name: Validate Kubernetes manifests
        run: |
          python3 -c "
          import yaml, glob, sys
          errors = []
          for f in glob.glob('infra/k8s/**/*.yaml', recursive=True):
              try:
                  list(yaml.safe_load_all(open(f)))
              except yaml.YAMLError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              for e in errors: print('ERROR:', e)
              sys.exit(1)
          print(f'All K8s YAML files are valid')
          "
      - name: Validate docker-compose YAML structure
        run: |
          python3 -c "
          import yaml, sys
          try:
              data = list(yaml.safe_load_all(open('docker-compose.yml')))
              print('docker-compose.yml is valid YAML')
          except yaml.YAMLError as e:
              print('ERROR:', e)
              sys.exit(1)
          "

  # ---------------------------------------------------------------------------
  # Docker Build (on PR + push to main)
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker Build — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [lint, test, test-credit-scoring, test-loan-origination, test-repayment, test-disbursement, test-notification, test-collections, test-shared]
    strategy:
      matrix:
        service: [kyc, credit-scoring, loan-origination, repayment, notification, collections]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Lowercase image prefix
        run: echo "IMAGE_PREFIX=$(echo $IMAGE_PREFIX | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build image — ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          target: production
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:pr-${{ github.event.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Security Scan (Trivy — on push to main)
  # ---------------------------------------------------------------------------
  security-scan:
    name: Security Scan — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'
    permissions:
      security-events: write
      contents: read
    strategy:
      matrix:
        service: [kyc]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          target: production
          push: false
          load: true
          tags: lendkit-${{ matrix.service }}:scan

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: lendkit-${{ matrix.service }}:scan
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'  # don't fail CI, just report
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif

  # ---------------------------------------------------------------------------
  # Publish Images (push to main only)
  # ---------------------------------------------------------------------------
  publish:
    name: Publish Images
    runs-on: ubuntu-latest
    needs: [docker-build, validate-configs]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [kyc, credit-scoring, loan-origination, repayment, notification, collections]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Lowercase image prefix
        run: echo "IMAGE_PREFIX=$(echo $IMAGE_PREFIX | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push — ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
